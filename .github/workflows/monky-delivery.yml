name: Publish verified Monky changes
on:
  push:
    branches: [improvement/monky-stability-ux-20261009]
    paths:
      - '.github/monky-delivery/**'
      - '.github/workflows/monky-delivery.yml'
permissions:
  contents: write
concurrency:
  group: monky-verified-delivery
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ZaidrakeOMG/monky_game' && github.ref == 'refs/heads/improvement/monky-stability-ux-20261009'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply authored changes with preimage and postimage verification
        env:
          TARGET_BRANCH: improvement/monky-stability-ux-20261009
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 041c8f0f6f1347e53deeba02ab11653a30bc9721 HEAD
          git config user.name 'Monky maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          parts = sorted((root / '.github/monky-delivery').glob('part-*.b64'))
          assert len(parts) == 5, 'Incomplete delivery'
          packed = base64.b64decode(''.join(p.read_text(encoding='ascii') for p in parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '873c60e965f3dc8fa00732b793941e28139c1f711ed1a398205d06197a484a80', 'Delivery checksum mismatch'
          plan = json.loads(lzma.decompress(packed).decode('utf-8'))
          assert plan['base'] == '041c8f0f6f1347e53deeba02ab11653a30bc9721'
          assert len(plan['commits']) == 5
          verified = {}
          for stage in plan['commits']:
              changes = []
              for entry in stage['files']:
                  rel = pathlib.PurePosixPath(entry['path'])
                  assert not rel.is_absolute() and '..' not in rel.parts
                  assert rel.parts and rel.parts[0] not in ('.git', '.github')
                  path = root.joinpath(*rel.parts)
                  assert not path.is_symlink() and path.resolve().is_relative_to(root)
                  old = path.read_bytes() if path.exists() else None
                  before = hashlib.sha256(old).hexdigest() if old is not None else None
                  assert before == entry['before'], f'Concurrent/preimage mismatch: {rel}'
                  if entry['after'] is None:
                      path.unlink()
                  else:
                      lines = (old or b'').decode('utf-8').splitlines(keepends=True)
                      limit = len(lines)
                      for start, end, replacement in reversed(entry['edits']):
                          assert 0 <= start <= end <= limit, f'Invalid edit range: {rel}'
                          lines[start:end] = replacement.splitlines(keepends=True)
                          limit = start
                      new = ''.join(lines).encode('utf-8')
                      assert hashlib.sha256(new).hexdigest() == entry['after'], f'Postimage mismatch: {rel}'
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(new)
                  verified[str(rel)] = entry['after']
                  changes.append(str(rel))
              subprocess.run(['git', 'add', '-A', '--', *changes], check=True)
              subprocess.run(['git', 'commit', '-m', stage['message']], check=True)
          for rel, expected in verified.items():
              path = root / rel
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert actual == expected, f'Final verification failed: {rel}'
          print(f'VERIFIED: {len(verified)} changed paths; 5 organized commits; all SHA-256 postimages match.')
          PY
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git log -6 --oneline

name: Godot quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified official Godot binary
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot" reports
          curl --fail --location --retry 3 "$base/$archive" -o "$RUNNER_TEMP/godot/$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          (cd "$RUNNER_TEMP/godot" && grep " $archive\$" SHA512-SUMS.txt | sha512sum --check -)
          unzip -q "$RUNNER_TEMP/godot/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/godot/godot" --version | tee reports/engine.txt
      - name: Audit assets, PNG integrity and references
        run: python3 tools/audit_assets.py
      - name: Import and run isolated regression and navigation checks
        run: python3 tools/run_checks.py --godot godot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-quality-report
          path: reports/
          retention-days: 14
          if-no-files-found: error
